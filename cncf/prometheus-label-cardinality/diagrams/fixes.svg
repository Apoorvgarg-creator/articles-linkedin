<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="550" viewBox="0 0 1600 550"><rect width="1600" height="550" fill="#fbf9f3"/><text x="40" y="56" font-family="Caveat, 'Comic Sans MS', cursive" font-size="40" fill="#1d1d1f" text-anchor="start" font-weight="700" xml:space="preserve">Wrong quick fix vs right fix (measured)</text><rect x="40" y="90" width="740" height="420" rx="6" fill="#fdf0ee" stroke="#d6342a" stroke-width="3"/><text x="70" y="140" font-family="Caveat, 'Comic Sans MS', cursive" font-size="30" fill="#d6342a" text-anchor="start" font-weight="700" xml:space="preserve">WRONG: labeldrop user_id at scrape time</text><text x="70" y="190" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="24" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">metric_relabel_configs:</text><text x="70" y="222" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="24" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">  - action: labeldrop</text><text x="70" y="254" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="24" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">    regex: user_id</text><text x="70" y="320" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="26" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">series:      4,302 -&gt; 6</text><text x="70" y="360" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="26" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">sum (truth): 10,100</text><text x="70" y="400" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="26" fill="#d6342a" text-anchor="start" font-weight="400" xml:space="preserve">sum (after): 16</text><text x="70" y="460" font-family="Caveat, 'Comic Sans MS', cursive" font-size="26" fill="#d6342a" text-anchor="start" font-weight="400" xml:space="preserve">up = 1, no scrape error. Wrong numbers, silently.</text><rect x="820" y="90" width="740" height="420" rx="6" fill="#eef3fb" stroke="#2a5db0" stroke-width="3"/><text x="850" y="140" font-family="Caveat, 'Comic Sans MS', cursive" font-size="30" fill="#2a5db0" text-anchor="start" font-weight="700" xml:space="preserve">RIGHT: fix the code, then add a seatbelt</text><text x="850" y="195" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="24" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">1. labels = ["route", "status"]</text><text x="870" y="230" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="24" fill="#2a5db0" text-anchor="start" font-weight="400" xml:space="preserve">-&gt; 6 series. user_id goes to logs.</text><text x="850" y="300" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="24" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">2. sample_limit: 5000</text><text x="870" y="335" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="24" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">-&gt; 10k app scrape refused</text><text x="870" y="370" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="24" fill="#d6342a" text-anchor="start" font-weight="400" xml:space="preserve">   up = 0, "sample limit exceeded"</text><text x="850" y="460" font-family="Caveat, 'Comic Sans MS', cursive" font-size="26" fill="#2a5db0" text-anchor="start" font-weight="400" xml:space="preserve">Loud failure you can alert on, not a quiet bill.</text></svg>