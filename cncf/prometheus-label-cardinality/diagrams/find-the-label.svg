<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="510" viewBox="0 0 1600 510"><rect width="1600" height="510" fill="#fbf9f3"/><text x="40" y="56" font-family="Caveat, 'Comic Sans MS', cursive" font-size="40" fill="#1d1d1f" text-anchor="start" font-weight="700" xml:space="preserve">Find the label that explodes: ask the TSDB status API</text><rect x="40" y="90" width="760" height="330" rx="6" fill="#fff" stroke="#1d1d1f" stroke-width="2.5"/><text x="70" y="135" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="28" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">GET /api/v1/status/tsdb</text><text x="70" y="175" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="26" fill="#8d8a84" text-anchor="start" font-weight="400" xml:space="preserve">labelValueCountByLabelName:</text><text x="100" y="225" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="30" fill="#d6342a" text-anchor="start" font-weight="400" xml:space="preserve">user_id    9794</text><text x="100" y="270" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="30" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">__name__   6</text><text x="100" y="315" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="30" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">route      3</text><text x="100" y="360" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="30" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">status     2</text><ellipse cx="260" cy="215" rx="230" ry="34" fill="none" stroke="#d6342a" stroke-width="3.5"/><rect x="840" y="90" width="720" height="330" rx="6" fill="#fff" stroke="#1d1d1f" stroke-width="2.5"/><text x="870" y="135" font-family="Caveat, 'Comic Sans MS', cursive" font-size="28" fill="#8d8a84" text-anchor="start" font-weight="400" xml:space="preserve">PromQL, same run:</text><text x="870" y="185" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="22" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">count by (__name__) ({__name__=~".+"})</text><text x="870" y="220" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="22" fill="#d6342a" text-anchor="start" font-weight="400" xml:space="preserve">-&gt; http_requests_total 25728</text><text x="870" y="285" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="22" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">count(count by (user_id)</text><text x="870" y="315" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="22" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">  (http_requests_total))</text><text x="870" y="350" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="22" fill="#d6342a" text-anchor="start" font-weight="400" xml:space="preserve">-&gt; 9794</text><text x="40" y="470" font-family="Caveat, 'Comic Sans MS', cursive" font-size="32" fill="#d6342a" text-anchor="start" font-weight="400" xml:space="preserve">10k-user run. One label holds almost all the values.</text></svg>