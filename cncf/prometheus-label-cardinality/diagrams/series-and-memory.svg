<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><rect width="1600" height="700" fill="#fbf9f3"/><text x="40" y="56" font-family="Caveat, 'Comic Sans MS', cursive" font-size="40" fill="#1d1d1f" text-anchor="start" font-weight="700" xml:space="preserve">Same counter, more user_ids (Prometheus 3.15.0, measured on one box)</text><rect x="90" y="516" width="150" height="4" rx="2" fill="#dde6f5" stroke="#2a5db0" stroke-width="2.5"/><text x="165" y="502" font-family="Caveat, 'Comic Sans MS', cursive" font-size="28" fill="#2a5db0" text-anchor="middle" font-weight="400" xml:space="preserve">6 series</text><text x="165" y="560" font-family="Kalam, 'Comic Sans MS', sans-serif" font-size="28" fill="#1d1d1f" text-anchor="middle" font-weight="400" xml:space="preserve">0 users</text><text x="165" y="610" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="26" fill="#2a5db0" text-anchor="middle" font-weight="400" xml:space="preserve">RSS 82 MB</text><text x="165" y="645" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="22" fill="#8d8a84" text-anchor="middle" font-weight="400" xml:space="preserve">heap 18 MB</text><rect x="350" y="513.0789650087142" width="150" height="6.921034991285695" rx="2" fill="#f6d5d2" stroke="#d6342a" stroke-width="2.5"/><text x="425" y="499.07896500871425" font-family="Caveat, 'Comic Sans MS', cursive" font-size="28" fill="#d6342a" text-anchor="middle" font-weight="400" xml:space="preserve">4,302 series</text><text x="425" y="560" font-family="Kalam, 'Comic Sans MS', sans-serif" font-size="28" fill="#1d1d1f" text-anchor="middle" font-weight="400" xml:space="preserve">1k users</text><text x="425" y="610" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="26" fill="#d6342a" text-anchor="middle" font-weight="400" xml:space="preserve">RSS 98 MB</text><text x="425" y="645" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="22" fill="#8d8a84" text-anchor="middle" font-weight="40