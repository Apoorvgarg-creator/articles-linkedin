text x="1160" y="245" font-family="Caveat, 'Comic Sans MS', cursive" font-size="34" fill="#1d1d1f" text-anchor="start" font-weight="400" xml:space="preserve">adds its own series.</text><text x="1160" y="320" font-family="Caveat, 'Comic Sans MS', cursive" font-size="34" fill="#d6342a" text-anchor="start" font-weight="400" xml:space="preserve">About 2 KB of heap</text><text x="1160" y="365" font-family="Caveat, 'Comic Sans MS', cursive" font-size="34" fill="#d6342a" text-anchor="start" font-weight="400" xml:space="preserve">per series in this run.</text><text x="1160" y="440" font-family="Caveat, 'Comic Sans MS', cursive" font-size="30" fill="#8d8a84" text-anchor="start" font-weight="400" xml:space="preserve">Scrape took 2.72 s</text><text x="1160" y="480" font-family="Caveat, 'Comic Sans MS', cursive" font-size="30" fill="#8d8a84" text-anchor="start" font-weight="400" xml:space="preserve">at 100k users.</text></svg>